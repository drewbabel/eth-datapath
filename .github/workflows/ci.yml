name: CI

env:
  OSS_CAD_SUITE: '2026-07-24'

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testbenches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE }}
      - name: Run every testbench
        run: |
          shopt -s nullglob
          for tb in tb/*_tb.sv; do
            mod=$(basename "$tb" _tb.sv)
            echo "== $mod =="
            make MOD="$mod"
          done

  formal-list:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - name: Split formal tasks into groups
        id: list
        run: |
          groups=$(python3 - <<'PY'
          import glob, json, os, re
          items = []
          for f in sorted(glob.glob('formal/*.sby')):
              mod = os.path.basename(f)[:-4]
              block = re.search(r'^\[tasks\]\s*\n(.*?)(?=^\[|\Z)', open(f).read(), re.S | re.M)
              tasks = [l.split()[0] for l in block.group(1).splitlines()
                       if l.strip() and not l.lstrip().startswith('#')] if block else ['']
              items += ['%s:%s' % (mod, t) for t in tasks]
          n = min(len(items), 16)
          g = [[] for _ in range(n)]
          for i, x in enumerate(items):
              g[i % n].append(x)
          print(json.dumps([' '.join(x) for x in g if x]))
          PY
          )
          echo "$groups"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  formal:
    needs: formal-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.formal-list.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.OSS_CAD_SUITE }}
      - name: Prove the group
        run: |
          for item in ${{ matrix.group }}; do
            mod=${item%%:*}
            task=${item#*:}
            echo "== $mod $task =="
            if [ -n "$task" ]; then
              sby -f "formal/$mod.sby" "$task"
            else
              sby -f "formal/$mod.sby"
            fi
          done

  ci-gate:
    if: always()
    needs: [testbenches, formal-list, formal]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more required CI jobs did not succeed."
          exit 1
