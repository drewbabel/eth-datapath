name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testbenches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Icarus Verilog
        run: |
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Run every testbench
        run: |
          shopt -s nullglob
          for tb in tb/*_tb.sv; do
            mod=$(basename "$tb" _tb.sv)
            echo "== $mod =="
            make MOD="$mod"
          done

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prove every configuration
        run: |
          shopt -s nullglob
          for sby in formal/*.sby; do
            mod=$(basename "$sby" .sby)
            echo "== $mod =="
            make formal MOD="$mod"
          done

  ci-gate:
    if: always()
    needs: [testbenches, formal]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more required CI jobs did not succeed."
          exit 1
